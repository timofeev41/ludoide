[package]
name = "ludo"
version = "0.1.0"
edition = "2024"
description = "A small, fast IDE for data engineering: ClickHouse, SQL, YAML, Python, terminals."
license = "MIT"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui-phosphor = "0.14.0"
egui_commonmark = "0.26.0"
egui_extras = "0.37.0"
fontdb = "0.24.0"
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native"] }
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sqlparser = "0.63.0"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }
vt100 = "0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep dependencies optimized in debug builds so the dev app stays snappy.
[profile.dev.package."*"]
opt-level = 2
