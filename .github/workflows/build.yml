name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the macOS app to, e.g. v0.0.3 (created on the run's commit if new; optional)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  macos:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      # Set for published releases, pushed v* tags, or when a tag is given to a manual run.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Releases build their tag; manual runs build the branch they were started on.
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: scripts/bundle_macos.sh
        env:
          # Name the zip (and the app's version) after the release tag, e.g. v0.0.2 -> 0.0.2.
          LUDO_VERSION: ${{ env.RELEASE_TAG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ludo-macos
          path: dist/*.zip
      - name: Attach to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No release yet (pushed tag or manual run): create it — and the tag, on the
          # commit just built — with notes generated from the commits.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
                 --generate-notes --target "$(git rev-parse HEAD)"
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
